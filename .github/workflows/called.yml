name: AWS Nuke Cleanup (Test)

on:
  workflow_call:
    inputs:
      account_id:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm reusable workflow was called
        run: |
          echo "Reusable workflow called for account: ${{ inputs.account_id }}"
          echo "This is a test only; no AWS resources are accessed."

      - name: Checkout
        uses: actions/checkout@v6
        with:
           persist-credentials: false

      - name: display the files
        run: |
          ls -la
      # ...existing code...
      - name: Create a test file
        run: |
          echo "Changing the file for account: ${{ inputs.account_id }}"
          touch "$GITHUB_WORKSPACE/aws-nuke/file_for_account_${{ inputs.account_id }}.txt"
          ls -la "$GITHUB_WORKSPACE"

      - name: open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Add test file for account ${{ inputs.account_id }}"
          branch: "test-file-${{ inputs.account_id }}"
          title: "Add test file for account ${{ inputs.account_id }}"
          body: | 
              This PR adds a test file for account ${{ inputs.account_id }}
              and was triggered by Workflow triggered by @${{ github.triggering_actor }}