name: AWS Nuke Cleanup (Test)

on:
  workflow_call:
    inputs:
      account_id:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm reusable workflow was called
        run: |
          echo "Reusable workflow called for account: ${{ inputs.account_id }}"
          echo "This is a test only; no AWS resources are accessed."

      - name: Checkout
        uses: actions/checkout@v6

      - name: display the files
        run: |
          ls -la